name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API — lint, tipos e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (formatação)
        run: black --check .

      - name: Mypy (tipos)
        run: mypy

      - name: PyTest
        run: pytest

  scraper:
    name: Scraper — lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -e "api/[dev]"
          pip install -r scraper/requirements.txt

      - name: Ruff (lint)
        run: ruff check scraper

      - name: Black (formatação)
        run: black --check scraper

      - name: Mypy (tipos)
        run: MYPYPATH=api mypy --config-file scraper/pyproject.toml -p scraper

      - name: PyTest
        run: pytest scraper/tests
