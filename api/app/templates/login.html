{% extends "base.html" %}
{% block titulo %}Entrar — Ponte Italia{% endblock %}
{% block conteudo %}
<div class="max-w-md mx-auto">
  <div class="rounded-2xl bg-white p-8 shadow-sm border border-gray-100">
    <h1 id="titulo-form" class="text-2xl font-extrabold tracking-tight">Entrar</h1>
    <p class="mt-1 text-sm text-gray-600">Acesse seu cofre de documentos.</p>

    <form id="form-auth" class="mt-6 space-y-4">
      <div id="campo-nome" class="hidden">
        <label class="block text-sm font-semibold mb-1" for="nome">Nome</label>
        <input id="nome" type="text" minlength="2"
               class="w-full rounded-xl border border-gray-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-verde/50">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1" for="email">E-mail</label>
        <input id="email" type="email" required
               class="w-full rounded-xl border border-gray-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-verde/50">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1" for="senha">Senha</label>
        <input id="senha" type="password" required minlength="8"
               class="w-full rounded-xl border border-gray-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-verde/50">
      </div>
      <p id="erro" class="hidden text-sm text-red-700"></p>
      <button type="submit"
              class="w-full rounded-xl bg-verde px-4 py-3 text-white font-bold hover:opacity-90 transition-opacity">
        Entrar
      </button>
    </form>

    <p class="mt-5 text-sm text-gray-600 text-center">
      <span id="alterna-texto">Ainda não tem perfil?</span>
      <button id="alterna" class="font-semibold text-verde hover:underline">Criar meu perfil</button>
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let modoRegistro = false;
  const $ = (id) => document.getElementById(id);

  $("alterna").addEventListener("click", () => {
    modoRegistro = !modoRegistro;
    $("campo-nome").classList.toggle("hidden", !modoRegistro);
    $("titulo-form").textContent = modoRegistro ? "Criar perfil" : "Entrar";
    $("form-auth").querySelector("button[type=submit]").textContent =
      modoRegistro ? "Criar perfil" : "Entrar";
    $("alterna-texto").textContent = modoRegistro ? "Já tem perfil?" : "Ainda não tem perfil?";
    $("alterna").textContent = modoRegistro ? "Entrar" : "Criar meu perfil";
  });

  $("form-auth").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    $("erro").classList.add("hidden");
    const email = $("email").value, senha = $("senha").value;
    try {
      if (modoRegistro) {
        const registro = await fetch("/api/auth/registrar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome: $("nome").value, email, senha }),
        });
        if (!registro.ok) throw new Error((await registro.json()).detail || "Falha no registro");
      }
      const resposta = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, senha }),
      });
      if (!resposta.ok) throw new Error((await resposta.json()).detail || "Falha no login");
      const dados = await resposta.json();
      localStorage.setItem("token", dados.access_token);
      localStorage.setItem("estudante_id", dados.estudante_id);
      window.location.href = "/estudantes/" + dados.estudante_id;
    } catch (erro) {
      $("erro").textContent = erro.message;
      $("erro").classList.remove("hidden");
    }
  });
</script>
{% endblock %}
