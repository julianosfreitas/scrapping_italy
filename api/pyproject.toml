[project]
name = "ponte-italia-api"
version = "0.1.0"
description = "API core da plataforma Ponte Italia (FastAPI, estilo funcional)"
authors = [{ name = "Juliano Freitas", email = "julianof29contato@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.44",
    "alembic>=1.13",
    "pydantic>=2.12",
    "httpx>=0.27",
    "deep-translator>=1.11",
    "pymysql>=1.1",
    "cryptography>=43.0",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deep_translator.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
