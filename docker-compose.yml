services:
  mysql:
    image: mysql:8.0
    container_name: ponte_italia_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ponte_italia}
      MYSQL_USER: ${MYSQL_USER:-ponte}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ponte}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ponte_italia_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP de TESTE (dev): captura os e-mails da newsletter em vez de enviá-los.
  # Caixa de entrada web em http://localhost:8025. Em produção o worker aponta
  # para SendGrid/Resend com domínio verificado — ver docs/ARQUITETURA.md.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ponte_italia_mailpit
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  mysql_data:
  redis_data:
